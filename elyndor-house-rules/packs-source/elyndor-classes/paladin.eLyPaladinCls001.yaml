  description:
    summary: >-
      The paladin is a devoted crusader. Elyndor house rule: no alignment
      restriction on Smite Evil or on which deity a Paladin may worship,
      provided the character adheres to that deity's tenets
      (Docs/house-rules §5).
    value: >-
      <p>Standard Pathfinder Paladin (see RefCode/packs/classes/paladin.*.yaml
      for the full class text this entry intentionally omits to avoid
      duplicating it).</p><p><strong>Elyndor House Rule</strong>: pf1 has no
      code-level enforcement of Smite Evil's evil-only targeting or of
      alignment/deity matching today (confirmed: zero hits searching pf1's
      own source for "smite", and `alignment`/`deity` are unenforced
      free-text fields) — so there is nothing to mechanically override here.
      This entry's <code>alignment</code> field above is updated to reflect
      the house rule textually. A Paladin may worship any deity, provided
      she adheres to that deity's tenets; Smite Evil is unrestricted by
      target alignment. Full mechanical automation of Smite Evil (evil-only
      targeting, Cha-to-attack, level-to-damage, DR bypass) is out of scope
      of this house rule and would be a separate feature if ever
      requested.</p>
