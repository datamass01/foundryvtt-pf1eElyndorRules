    summary: >-
      The rogue is a thief and a scout. Elyndor house rule: free Weapon
      Finesse (Docs/house-rules §5).
    value: >-
      <p>Standard Pathfinder Rogue (see RefCode/packs/classes/rogue.*.yaml
      for the full class text this entry intentionally omits to avoid
      duplicating it).</p><p><strong>Elyndor House Rule</strong>: This Rogue
      gains Weapon Finesse for free — it does not consume a Rogue Talent or
      a feat slot. Mechanically this is the <code>weaponFinesse</code>
      changeFlag (the same flag pf1's own Weapon Finesse feat sets, consumed
      generically by the action-resolution code) declared directly on this
      class item above, active for as long as the character has a level in
      this class — no separate linked item needed.</p><p>Note: pf1 already
      ships an existing "Hide in Plain Sight (ROG)" Advanced Talent
      (Compendium.pf1.class-abilities.Item.k2DralSO0RIdeilQ), already tagged
      for Rogue/Rogue (Unchained)/Ninja and discoverable via the Compendium
      Browser's talent filter — Docs/house-rules §5's "new Advanced Talent"
      request may already be satisfied by this existing item; no duplicate
      talent has been created here pending confirmation with the GM.</p>
