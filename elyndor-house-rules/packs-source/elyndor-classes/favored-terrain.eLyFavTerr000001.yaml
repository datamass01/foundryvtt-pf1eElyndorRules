name: Favored Terrain (Elyndor)
system:
  abilityType: ex
  associations:
    classes:
      - Ranger
  description:
    value: >-
      <p><strong>Elyndor House Rule</strong> (Docs/house-rules §5): each time
      this feature is gained or improved, the ranger selects <strong>two</strong>
      terrains instead of one. This is a text-only update — selection and the
      terrain skill/initiative bonuses remain manually tracked by the
      player/GM, matching how pf1 already treats this ability (no automated
      picker or bonus-tracking exists for Favored Terrain even at the normal
      1-terrain rate).</p><p>At 3rd level, a ranger may select two types of
      terrain from Table: Ranger Favored Terrains. The ranger gains a +2
      bonus on <em>initiative</em> checks and <em>Knowledge</em> (geography),
      <em>Perception</em>, <em>Stealth</em>, and <em>Survival skill
      checks</em> when he is in either of these terrains. A ranger traveling
      through a <em>favored terrain</em> normally leaves no trail and cannot
      be tracked (though he may leave a trail if he so chooses).</p>

      <p>At 8th level and every five levels thereafter, the ranger may select
      two additional <em>favored terrains</em>. In addition, at each such
      interval, the skill bonus and <em>initiative</em> bonus in any one
      <em>favored terrain</em> (including one just selected, if so desired),
      increases by +2.</p>

      <p>If a specific terrain falls into more than one category of
      <em>favored terrain</em>, the ranger's bonuses do not stack; he simply
      uses whichever bonus is higher.</p>

      <hr>

      <table><caption>Table: Ranger Favored Terrains</caption>

      <thead>

      <tr>

      <th>Favored Terrains</th>

      </tr>

      </thead>

      <tbody>

      <tr>

      <td>Cold (ice, glaciers, snow, and tundra)</td>

      </tr>

      <tr>

      <td>Desert (sand and wastelands)</td>

      </tr>

      <tr>

      <td>Forest (coniferous and deciduous)</td>

      </tr>

      <tr>

      <td>Jungle</td>

      </tr>

      <tr>

      <td>Mountain (including hills)</td>

      </tr>

      <tr>

      <td>Plains</td>

      </tr>

      <tr>

      <td>Planes (pick one, other than <em>Material Plane</em>)</td>

      </tr>

      <tr>

      <td>Swamp</td>

      </tr>

      <tr>

      <td>Underground (caves and dungeons)</td>

      </tr>

      <tr>

      <td>Urban (buildings, streets, and sewers)</td>

      </tr>

      <tr>

      <td>Water (above and below the surface)</td>

      </tr>

      </tbody>

      </table>
