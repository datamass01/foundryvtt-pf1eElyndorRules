      for the full class text this entry intentionally omits to avoid
      duplicating it).</p><p><strong>Elyndor House Rule</strong>: Favored
      Terrain (linked below at 3rd level) is replaced with an Elyndor
      variant granting 2 terrain selections per pick instead of 1 — a
      text-only update, since pf1 doesn't automate terrain selection or its
      bonuses even at the normal 1-terrain rate. Hunter's Bond (linked below
      at 4th level) is replaced with an Elyndor variant that always grants
      the ally-sharing bond — the animal companion option is removed by
      default per Docs/house-rules §5.1.</p>
