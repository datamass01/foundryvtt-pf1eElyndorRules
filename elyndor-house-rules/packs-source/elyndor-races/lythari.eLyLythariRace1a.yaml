              </tr>
          </thead>
          <tbody>
              <tr>
                  <td>110 years</td>
                  <td>
                      <p>+4d6 years<br>(114 – 134 years)</p>
                  </td>
                  <td>
                      <p>+6d6 years<br>(116 – 146 years)</p>
                  </td>
                  <td>
                      <p>+10d6 years<br>(120 – 170 years)</p>
                  </td>
              </tr>
          </tbody>
