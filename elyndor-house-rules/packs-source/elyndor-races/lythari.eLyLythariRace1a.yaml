      <h2>Standard Racial Traits</h2>
      <ul>
          <li><strong>Ability Score Modifiers</strong>: Lythari are nimble, both in body and mind, but their form is frail. They gain +2 <em>Dexterity</em>, +2 <em>Intelligence</em>, and –2 <em>Constitution</em>.</li>
          <li><strong>Type</strong>: Lythari are Fey with the shapechanger subtype.</li>
          <li><strong>Size</strong>: Lythari are Medium creatures and thus receive no bonuses or penalties due to their size.</li>
          <li><strong>Base Speed</strong>: Lythari have a base speed of 20 feet.</li>
          <li><strong>Languages</strong>: Lythari begin play speaking Common and Elven. Lythari with high <em>Intelligence</em> scores can choose from the following: Celestial, Draconic, Gnoll, Gnome, Goblin, Orc, and Sylvan.</li>
      </ul>
      <h3>Defense Racial Traits</h3>
      <ul>
          <li><strong>Elven Immunities</strong>: Lythari are immune to magic <em>sleep</em> effects and gain a +2 racial saving throw bonus against <em>enchantment</em> spells and effects.</li>
          <li><strong>Elemental Resistances:</strong> The lythari are Fey and come from an artic place in the feywild, they have developed a natural resistance to the dangers of their homeland over the course of thousands of generations. They gain elemental resistance 5 to cold as well as a endure elements cold effect.</li>
          <li><strong>Feykissed: </strong>Lythari gain a +1 racial bonus on saving throws, but cannot abide the touch of iron or steel; contact with either metal deals 1d4 points of damage each round, and wearing metal armor prevents them from casting spells until it is removed.</li>
          <li><strong>Damage reduction: </strong>DR 5/Iron-Steel</li>
      </ul>
      <h3>Feat and Skill Racial Traits</h3>
      <ul>
          <li><strong>Keen Senses</strong>: Lythari receive a +2 <em>racial bonus</em> on @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.2h6hz5AkTDxKPFxr]{Perception} and @UUID[Compendium.pf1.rules.JournalEntry.x175kVqUfLGPt8tC]{Survival checks}.</li>
          <li><strong>Lycanthropic Empathy: </strong>In any form, natural lycanthropes can communicate and empathize with animals related to their animal form. They can use Diplomacy to alter such an animal's attitude, and when so doing gain a +4 racial bonus on the check. (wolves and dire wolves)</li>
          <li><strong>Change Shape: </strong>All Lythari have three forms—a Elven form, an wolf form, and a hybrid form. Equipment does not meld with the new form between humanoid and hybrid form, but does between those forms and animal form. A Lythari can shift to any of its three alternate forms as a move-equivalent action. A slain Lythari reverts to its elven form, although it remains dead.</li>
      </ul>
      <h3>Senses Racial Traits</h3>
      <ul>
          <li><strong>Low-Light Vision</strong>: Lythari can see twice as far as <em>humans</em> in conditions of dim light.</li>
          <li><strong>Scent:</strong> As the monster quality</li>
      </ul>
  languages:
    - common
    - elven
  size: med
  speeds:
    land: 20
  tags:
    - Elyndor
type: race
