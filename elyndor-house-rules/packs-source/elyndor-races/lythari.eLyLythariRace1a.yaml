      <p><sup>1</sup> This category includes barbarians, oracles, rogues, and sorcerers.<br><sup>2</sup> This category includes bards, cavaliers, fighters, gunslingers, paladins, rangers, summoners, and witches.<br><sup>3</sup> This category includes alchemists, clerics, druids, inquisitors, magi, monks, and wizards.</p>
      <h2>Height and Weight</h2>
