_id: eLyLythariRace1a
_key: '!items!eLyLythariRace1a'
img: systems/pf1/icons/races/creature-types/fey.png
name: Lythari
system:
  # pf1 v11.11 stores these as arrays (and changeFlags as a boolean map),
  # verified against the shipped pf1 system's own compiled race compendium —
  # a TypedObjectField/SetField shape is rejected by the installed system:
  # Item preparation does `for...of` over `system.changes`, throws, and
  # dropping the race onto a sheet is a silent no-op.
  changeFlags:
    immuneToMorale: false
    loseDexToAC: false
    noMediumEncumbrance: false
    noHeavyEncumbrance: false
    mediumArmorFullSpeed: false
    heavyArmorFullSpeed: false
    lowLightVision: true
    seeInvisibility: false
    seeInDarkness: false
  changes:
    - _id: eLyLythDex001
      formula: '2'
      target: dex
      type: racial
    - _id: eLyLythInt001
      formula: '2'
      target: int
      type: racial
    - _id: eLyLythCon001
      formula: '-2'
      target: con
      type: racial
    - _id: eLyLythSav001
      formula: '1'
      target: allSavingThrows
      type: racial
    - _id: eLyLythPer001
      formula: '2'
      target: skill.per
      type: racial
    - _id: eLyLythSur001
      formula: '2'
      target: skill.sur
      type: racial
  contextNotes:
    - target: allSavingThrows
      text: |-
        +[[2]] Racial vs Enchantment Effects
        Immune to Magic Sleep
    - target: skill.dip
      text: +[[4]] Racial to influence wolves and dire wolves (Lycanthropic Empathy)
  creatureSubtypes:
    - shapechanger
  creatureTypes:
    - fey
  description:
    summary: >-
      Custom Elyndor race: a Fey-descended, lycanthropic elf-kin native to an
      arctic reach of the feywild. Full write-up in Docs/house-rules
      §9 (New Races). DR 5/iron-or-steel, cold resistance 5, and the
      three-form Change Shape trait are recorded here as description text
      only (matching pf1's own convention for race-granted energy
      resistance/DR — e.g. the core Ifrit compendium entry's fire resistance
      is text-only too — these are not structured fields on the race item's
      data model and are applied by the player/GM on the actor sheet).
    value: >-
